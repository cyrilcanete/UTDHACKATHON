<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morning Mirror</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><span id="greeting">Morning Mirror</span><span id="mode">Connecting</span><button id="privacy" type="button">Hide personal details</button></header>
<main><section class="clock"><p id="date"></p><h1 id="time">--:--</h1><p id="next">Your day, at a glance.</p></section>
<section class="weather"><h2 id="location">Weather</h2><div id="temperature">--°</div><p id="conditions"></p><p id="forecast"></p><small id="weather-status"></small></section>
<div class="reflection" aria-hidden="true"></div>
<section class="personal"><h2>Coming up</h2><ul id="events"></ul><small id="calendar-status"></small><h2>Today's focus</h2><ul id="tasks"></ul></section>
<section class="personal"><h2>Your briefing</h2><p id="summary">Loading your dashboard…</p><ul id="actions"></ul><small id="briefing-status"></small><h2 id="inbox-title">Inbox</h2><ul id="messages"></ul><small id="inbox-status"></small></section>
</main><footer><span id="connection">Starting…</span><span>Press P for privacy · F for full screen</span></footer></body></html>
